<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>TF Studio</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --text: #161a1f; --muted: #6b7684; --accent: #5a4fcf; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1116; --text: #e6e9ee; --muted: #8a94a3; --accent: #7d74ff; } }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
    .box { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 520px; padding: 24px; }
    .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--accent); border-right-color: transparent; animation: spin 0.8s linear infinite; }
    .title { font-size: 16px; font-weight: 650; }
    .msg { color: var(--muted); word-break: break-all; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div class="title">TF Studio</div>
    <div class="msg" id="msg">Starting…</div>
  </div>
  <script>
    const message = new URLSearchParams(location.search).get('message');
    if (message) document.getElementById('msg').textContent = message;
  </script>
</body>
</html>
